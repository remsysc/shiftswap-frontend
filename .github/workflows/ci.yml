name: CI / DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-and-privacy:
    name: Security, Privacy & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for Secret Leaks (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Tracked Sensitive Files
        run: |
          echo "Verifying no credentials, private keys, or environment secrets are committed..."
          FAIL=0
          for pattern in ".env" ".env.*" "*.key" "*.pem" "id_rsa*" "*.p12"; do
            MATCHES=$(git ls-files "$pattern" ":(exclude).env.example" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Sensitive file tracked in git repository: $MATCHES"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "Security check failed: remove sensitive files from git tracking."
            exit 1
          fi
          echo "Privacy check passed: no sensitive files tracked."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Audit NPM Dependencies
        run: npm audit --audit-level=high

  typecheck-and-build:
    name: Type Check & Production Build
    runs-on: ubuntu-latest
    needs: [security-and-privacy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vue TypeScript Type Check
        run: npm run check

      - name: Run Production Build
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || (echo "Missing dist/index.html" && exit 1)
          echo "Production build verified successfully."
